exclude: |
  (?x)^(
      .mypy_cache/
      | .venv/
      | __pycache__/
      | .ruff_cache/
      | web/node_modules/
      | src/toolbelt/ui/static/dist/
  )$

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy --show-error-codes src
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      # The web client (web/): needs `pnpm --dir web install` once.
      - id: web-typecheck
        name: web typecheck
        entry: pnpm --dir web typecheck
        files: ^web/
        exclude: ^web/node_modules/
        language: system
        pass_filenames: false
      - id: web-lint
        name: web lint
        entry: pnpm --dir web lint
        files: ^web/
        exclude: ^web/node_modules/
        language: system
        pass_filenames: false
      - id: web-test
        name: web tests (vitest)
        entry: pnpm --dir web test
        files: ^web/
        exclude: ^web/node_modules/
        language: system
        pass_filenames: false
      # The client's API types are generated from the Python wire models.
      - id: web-api-types
        name: web API types are current
        entry: pnpm --dir web check:types
        files: ^(web/src/api/|src/toolbelt/ui/(api_models|api_schema|pr_states|next_action|pr_activity)\.py$)
        language: system
        pass_filenames: false
