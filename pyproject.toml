[project]
name = "toolbelt"
version = "0.1.0"
description = ""
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pyyaml",
    "toml",
    "typer>=0.16.0",
    "pandas>=2.3.0",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "types-toml",
    "pre-commit",
    "mypy",
    "ruff",
    "types-pyyaml>=6.0.12.20250516",
    "pandas-stubs>=2.2.3.250527",
    "boto3-stubs>=1.38.36",
    "types-seaborn>=0.13.2.20250516",
    "pytest>=8.0.0",
    "pytest-bdd>=8.1.0",
    "syrupy>=5.5.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
toolbelt = "toolbelt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "deepagents.*",
    "langchain.*",
    "langgraph.*",
]
ignore_missing_imports = true
