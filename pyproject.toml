[project]
name = "toolbelt"
version = "0.1.0"
description = ""
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pyyaml",
    "typer>=0.16.0",
    "pandas>=2.3.0",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "rich>=13.9.4",
]

[dependency-groups]
dev = [
    "pre-commit",
    "mypy",
    "ruff",
    "types-pyyaml>=6.0.12.20250516",
    "pandas-stubs>=2.2.3.250527",
    "boto3-stubs>=1.38.36",
    "types-seaborn>=0.13.2.20250516",
    "pytest>=8.0.0",
    "pytest-bdd>=8.1.0",
    "syrupy>=5.5.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
toolbelt = "toolbelt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "deepagents.*",
    "langchain.*",
    "langgraph.*",
]
ignore_missing_imports = true

# Child processes must go through `toolbelt.logged_process` so the invocation
# log sees them; TID251 flags any direct use elsewhere.
[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.run".msg = "Use toolbelt.logged_process.run"
"subprocess.Popen".msg = "Use toolbelt.logged_process.Popen"
"subprocess.check_output".msg = "Use toolbelt.logged_process.check_output"
"subprocess.check_call".msg = "Use toolbelt.logged_process.run(check=True)"
"subprocess.call".msg = "Use toolbelt.logged_process.run"
"asyncio.create_subprocess_exec".msg = "Use toolbelt.logged_process.create_subprocess_exec"
"asyncio.create_subprocess_shell".msg = "Use toolbelt.logged_process.create_subprocess_exec"
"os.system".msg = "Use toolbelt.logged_process.run"

[tool.ruff.lint.per-file-ignores]
"src/toolbelt/logged_process.py" = ["TID251"]
"tests/**" = ["TID251"]
